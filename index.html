<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule with Titus</title>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, query, where
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ─── CONFIG — replace with your Firebase project values ─────────────────
    const firebaseConfig = {
      apiKey:            "REPLACE_WITH_YOUR_FIREBASE_API_KEY",
      authDomain:        "REPLACE_WITH_YOUR_PROJECT_ID.firebaseapp.com",
      projectId:         "REPLACE_WITH_YOUR_PROJECT_ID",
      storageBucket:     "REPLACE_WITH_YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "REPLACE_WITH_YOUR_MESSAGING_SENDER_ID",
      appId:             "REPLACE_WITH_YOUR_APP_ID"
    };
    // ────────────────────────────────────────────────────────────────────────

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    // Expose DB helpers on window so the non-module script can call them
    window._db = db;
    window._fbModules = { collection, doc, getDoc, getDocs, setDoc, deleteDoc, query, where };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;

      align-items: center;

    header {

      background: #111;
      padding: 28px 16px 18px;

    }

      align-items: center;
      justify-content: space-between;

    }

    .day-label {

      font-weight: 600;
      color: #aaa;

    #calendar-grid {

      grid-template-columns: repeat(7, 1fr);
      gap: 4px;

    .cal-cell {
      background: #1a1a1a;
      border-radius: 8px;
      min-height: 80px;

      align-items: center;
      justify-content: center;

    }
    .cal-cell.empty { background: transparent; cursor: default; border: none; }
    .cal-cell.closed {
      background: #161616;
      cursor: not-allowed;
      opacity: .55;
    }
    .cal-cell.past {
      opacity: .35;
      cursor: not-allowed;
    }
    .cal-cell.today { border-color: #1e88e5; background: #0d2a45; }
    .cal-cell.available:hover { border-color: #1e88e5; background: #172838; }
    .cal-cell.full { opacity: .45; cursor: not-allowed; }

    .cell-day {
      font-size: .85rem;
      font-weight: 700;
      align-self: flex-start;
      color: #ccc;
    }
    .cell-slots {
      font-size: .72rem;
      color: #90caf9;
      text-align: center;
      margin-top: 4px;
    }
    .cell-closed-text {
      font-size: .72rem;

    /* ── Overlay / Modal ────────────────────────────── */
    .overlay {
      display: none;

      inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 100;

      top: 12px; right: 14px;
      background: none; border: none;
      font-size: 1.4rem; color: #aaa; cursor: pointer;
    }
    .close-btn:hover { color: #fff; }

    /* Slot list */
    .slot-list { display: flex; flex-direction: column; gap: 8px; }
    .slot-btn {
      background: #1e3a5f;
      border: 1px solid #1e88e5;
      color: #90caf9;
      border-radius: 6px;
      padding: 10px 14px;
      text-align: left;
      cursor: pointer;
      font-size: .9rem;
      transition: background .15s;
    }
    .slot-btn:hover { background: #1565c0; color: #fff; }
    .slot-btn.booked { background: #2a1a1a; border-color: #555; color: #666; cursor: not-allowed; }

    /* Form */
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: .82rem; color: #aaa; margin-bottom: 4px; }
    input, select {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      color: #f0f0f0;
      border-radius: 6px;
      padding: 9px 11px;
      font-size: .9rem;
    }
    input:focus, select:focus { outline: none; border-color: #1e88e5; }
    .btn-primary {
      width: 100%;
      background: #1e88e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      transition: background .2s;
    }
    .btn-primary:hover { background: #1565c0; }
    .btn-primary:disabled { background: #444; cursor: not-allowed; }

    .btn-secondary {
      width: 100%;
      background: transparent;
      color: #90caf9;
      border: 1px solid #1e88e5;
      border-radius: 8px;
      padding: 10px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background .2s;
    }
    .btn-secondary:hover { background: #0d2a45; }

    .btn-danger {
      width: 100%;
      background: transparent;
      color: #ef9a9a;
      border: 1px solid #c62828;
      border-radius: 8px;
      padding: 10px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background .2s;
    }
    .btn-danger:hover { background: #2a1212; }

    #confirm-msg {
      text-align: center;
      padding: 8px 0;

    /* Appointment Management View */
    #appt-info p { margin-bottom: 8px; font-size: .92rem; line-height: 1.5; }

    /* ── Contact FAB ────────────────────────────────── */
    #contact-fab {
      position: fixed;

    }
    #contact-fab-btn:hover { background: #1565c0; }
    #contact-menu {
      display: none;
      flex-direction: column;
      gap: 8px;
      position: absolute;
      bottom: 66px; right: 0;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px;
      min-width: 160px;
    }
    #contact-menu.open { display: flex; }
    .contact-option {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
      color: #90caf9;
      font-size: .9rem;
      padding: 6px 8px;
      border-radius: 6px;
      transition: background .15s;
    }
    .contact-option:hover { background: #1e3a5f; color: #fff; }

    #loading-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: #90caf9;
    }
    #loading-overlay.active { display: flex; }

    @media (max-width: 520px) {
      .cal-cell { min-height: 60px; padding: 5px 3px; }
      .cell-day { font-size: .7rem; }
      .cell-slots { font-size: .6rem; }
    }
  </style>
</head>

<script>
// ─── EmailJS Config — replace with your values ──────────────────────────────
const EMAILJS_PUBLIC_KEY  = "REPLACE_WITH_YOUR_EMAILJS_PUBLIC_KEY";
const EMAILJS_SERVICE_ID  = "REPLACE_WITH_YOUR_EMAILJS_SERVICE_ID";
const EMAILJS_CONFIRM_TEMPLATE   = "template_confirm";
const EMAILJS_NOTIFY_TEMPLATE    = "template_notify";
const EMAILJS_MGMT_TEMPLATE      = "template_mgmt_update";
// ────────────────────────────────────────────────────────────────────────────

const OWNER_EMAIL = "contact@tituspaine.com";
const SITE_URL    = "https://tituspaine.github.io/schedule/";

emailjs.init(EMAILJS_PUBLIC_KEY);

// ─── Helpers ────────────────────────────────────────────────────────────────
function idb() { return window._db; }
function fbm() { return window._fbModules; }

function showLoading(v) {
  document.getElementById("loading-overlay").classList.toggle("active", v);
}

function pad2(n) { return String(n).padStart(2,"0"); }

function dateKey(y,m,d) {
  return `${y}-${pad2(m+1)}-${pad2(d)}`;
}

const MONTH_NAMES = ["January","February","March","April","May","June",
  "July","August","September","October","November","December"];

// ─── Slot Generation ────────────────────────────────────────────────────────
// day 0=Sun,1=Mon,...,6=Sat
function generateSlots(dateObj) {
  const dow = dateObj.getDay();
  if (dow === 0 || dow === 1) return null; // closed

  const slots = [];
  if (dow >= 2 && dow <= 5) {
    // Tue-Fri: 7:30-12:00 (10 slots) and 13:00-17:00 (10 slots)
    // Morning: 7:30 spaced evenly across 4.5h for 10 slots
    // afternoon: 13:00 spaced evenly across 4h for 10 slots
    // slot duration = 27min morning, 24min afternoon — keep it simple: 7:30,8:03,8:36...
    // Use exactly the times asked: 10 slots before lunch (7:30–12:00) and 10 after (13:00–17:00)
    // Morning: 4.5 hours = 270 min / 10 = 27 min each
    for (let i = 0; i < 10; i++) {
      const totalMin = 7*60 + 30 + i*27;
      slots.push(fmtTime(totalMin));
    }
    // Afternoon: 4 hours = 240 min / 10 = 24 min each
    for (let i = 0; i < 10; i++) {
      const totalMin = 13*60 + i*24;
      slots.push(fmtTime(totalMin));
    }
  } else if (dow === 6) {
    // Saturday: check actual open/close — assume same 7:30-17:00 with 30-min slots
    let t = 7*60+30;
    while (t + 30 <= 17*60) {
      slots.push(fmtTime(t));
      t += 30;
    }
  }
  return slots;
}

function fmtTime(totalMin) {
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  const ampm = h < 12 ? "AM" : "PM";
  const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return `${h12}:${pad2(m)} ${ampm}`;
}

// ─── Firebase booking helpers ────────────────────────────────────────────────
async function getBookedSlots(dateStr) {
  const { collection, query, where, getDocs } = fbm();
  const db = idb();
  const q = query(collection(db,"appointments"), where("date","==",dateStr), where("status","==","active"));
  const snap = await getDocs(q);
  const booked = new Set();
  snap.forEach(d => booked.add(d.data().slot));
  return booked;
}

async function bookSlot(apptData) {
  const { doc, setDoc } = fbm();
  const db = idb();
  // Idempotent write — use date+slot as doc ID to prevent double-booking
  const docId = `${apptData.date}_${apptData.slot.replace(/[: ]/g,"-")}`;
  const ref = doc(db, "appointments", docId);
  await setDoc(ref, { ...apptData, status: "active", createdAt: new Date().toISOString() }, { merge: false });
  return docId;
}

async function getAppointment(apptId) {
  const { doc, getDoc } = fbm();
  const snap = await getDoc(doc(idb(),"appointments",apptId));
  if (!snap.exists()) return null;
  return { id: snap.id, ...snap.data() };
}

async function cancelAppointment(apptId) {
  const { doc, setDoc } = fbm();
  await setDoc(doc(idb(),"appointments",apptId), { status:"cancelled" }, { merge:true });
}

async function rescheduleAppointment(apptId, newDate, newSlot) {
  const { doc, setDoc } = fbm();
  const db = idb();
  const newDocId = `${newDate}_${newSlot.replace(/[: ]/g,"-")}`;
  const oldRef = doc(db,"appointments",apptId);
  const newRef = doc(db,"appointments",newDocId);

  const oldSnap = await window._fbModules.getDoc(oldRef);
  if (!oldSnap.exists()) throw new Error("Appointment not found");
  const data = oldSnap.data();

  // Write new doc
  await setDoc(newRef, { ...data, date: newDate, slot: newSlot, status:"active",
    rescheduledFrom: apptId, updatedAt: new Date().toISOString() }, { merge: false });
  // Cancel old
  await setDoc(oldRef, { status:"cancelled" }, { merge:true });
  return newDocId;
}

// ─── Email helpers ───────────────────────────────────────────────────────────
async function sendEmail(templateId, params) {
  return emailjs.send(EMAILJS_SERVICE_ID, templateId, params);
}

function buildManagementLink(apptId) {
  return `${SITE_URL}?appt=${encodeURIComponent(apptId)}`;
}

async function sendConfirmationEmails(appt, apptId) {
  const link = buildManagementLink(apptId);
  const sharedParams = {
    client_name: appt.name,
    appt_date: appt.date,
    appt_slot: appt.slot,
    num_people: appt.people,
    client_phone: appt.phone,
    client_email: appt.email,
    manage_link: link
  };
  // Send to client
  await sendEmail(EMAILJS_CONFIRM_TEMPLATE, { ...sharedParams, to_email: appt.email, to_name: appt.name });
  // Notify owner
  await sendEmail(EMAILJS_NOTIFY_TEMPLATE, { ...sharedParams, to_email: OWNER_EMAIL, to_name: "Titus" });
}

async function sendMgmtUpdateEmail(appt, action, newDate, newSlot) {
  const params = {
    to_email: OWNER_EMAIL,
    to_name: "Titus",
    client_name: appt.name,
    action: action,
    old_date: appt.date,
    old_slot: appt.slot,
    new_date: newDate || "",
    new_slot: newSlot || "",
    client_phone: appt.phone,
    client_email: appt.email,
    num_people: appt.people
  };
  // Also notify the client
  const clientParams = { ...params, to_email: appt.email, to_name: appt.name };
  await sendEmail(EMAILJS_MGMT_TEMPLATE, params);
  await sendEmail(EMAILJS_MGMT_TEMPLATE, clientParams);
}

// ─── Calendar State ──────────────────────────────────────────────────────────
const today = new Date();
today.setHours(0,0,0,0);
let viewYear  = today.getFullYear();
let viewMonth = today.getMonth();

let selectedDate = null; // { year, month, day, dateStr, dateObj }
let selectedSlot = null;
let bookedSlotsCache = {}; // dateStr -> Set

async function renderCalendar() {
  const grid = document.getElementById("calendar-grid");
  grid.innerHTML = "";
  document.getElementById("month-title").textContent =
    `${MONTH_NAMES[viewMonth]} ${viewYear}`;

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

  // Fetch all booked slots for this month in one query
  showLoading(true);
  let monthBooked = {}; // dateStr -> Set<slot>
  try {
    const { collection, query, where, getDocs } = fbm();
    const startStr = dateKey(viewYear, viewMonth, 1);
    const endStr   = dateKey(viewYear, viewMonth, daysInMonth);
    const q = query(collection(idb(),"appointments"),
      where("date",">=",startStr), where("date","<=",endStr), where("status","==","active"));
    const snap = await getDocs(q);
    snap.forEach(d => {
      const data = d.data();
      if (!monthBooked[data.date]) monthBooked[data.date] = new Set();
      monthBooked[data.date].add(data.slot);
    });
  } catch(e) { console.warn("Firestore error:", e); }
  bookedSlotsCache = monthBooked;
  showLoading(false);

  // Empty leading cells
  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement("div");
    el.className = "cal-cell empty";
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateObj = new Date(viewYear, viewMonth, d);
    const dow = dateObj.getDay();
    const dStr = dateKey(viewYear, viewMonth, d);
    const isPast = dateObj < today;
    const isClosed = (dow === 0 || dow === 1);
    const cell = document.createElement("div");
    cell.className = "cal-cell";

    const dayLabel = document.createElement("div");
    dayLabel.className = "cell-day";
    dayLabel.textContent = d;
    cell.appendChild(dayLabel);

    if (dateObj.getTime() === today.getTime()) cell.classList.add("today");

    if (isClosed) {
      cell.classList.add("closed");
      const cl = document.createElement("div");
      cl.className = "cell-closed-text";
      cl.textContent = "CLOSED";
      cell.appendChild(cl);
    } else if (isPast) {
      cell.classList.add("past");
      const cl = document.createElement("div");
      cl.className = "cell-slots";
      cl.textContent = "—";
      cell.appendChild(cl);
    } else {
      const allSlots = generateSlots(dateObj) || [];
      const booked = monthBooked[dStr] || new Set();
      const available = allSlots.filter(s => !booked.has(s)).length;

      const cl = document.createElement("div");
      cl.className = "cell-slots";

      if (available === 0) {
        cl.textContent = "No slots";
        cell.classList.add("full");
      } else {
        cl.textContent = `${available} slot${available>1?"s":""} available`;
        cell.classList.add("available");
        cell.addEventListener("click", () => openSlotModal(viewYear, viewMonth, d));
      }
      cell.appendChild(cl);
    }

    grid.appendChild(cell);
  }
}

// ─── Slot Modal ──────────────────────────────────────────────────────────────
async function openSlotModal(y, m, d) {
  const dateObj = new Date(y, m, d);
  const dStr = dateKey(y, m, d);
  const allSlots = generateSlots(dateObj);
  if (!allSlots) return;

  const booked = bookedSlotsCache[dStr] || new Set();

  document.getElementById("slot-date-title").textContent =
    dateObj.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});

  const list = document.getElementById("slot-list");
  list.innerHTML = "";

  allSlots.forEach(slot => {
    const btn = document.createElement("button");
    btn.className = "slot-btn" + (booked.has(slot) ? " booked" : "");
    btn.textContent = slot + (booked.has(slot) ? " — Booked" : "");
    btn.disabled = booked.has(slot);
    if (!booked.has(slot)) {
      btn.addEventListener("click", () => {
        selectedDate = { year: y, month: m, day: d, dateStr: dStr, dateObj };
        selectedSlot = slot;
        closeOverlay("slot-overlay");
        openFormModal();
      });
    }
    list.appendChild(btn);
  });

  openOverlay("slot-overlay");
}

// ─── Form Modal ──────────────────────────────────────────────────────────────
function openFormModal() {
  document.getElementById("form-title").textContent =
    `Book: ${selectedDate.dateObj.toLocaleDateString("en-US",{month:"long",day:"numeric"})} @ ${selectedSlot}`;
  document.getElementById("confirm-msg").textContent = "";
  openOverlay("form-overlay");
}

document.getElementById("btn-confirm").addEventListener("click", async () => {
  const name   = document.getElementById("f-name").value.trim();
  const people = document.getElementById("f-people").value;
  const phone  = document.getElementById("f-phone").value.trim();
  const email  = document.getElementById("f-email").value.trim();
  const msg    = document.getElementById("confirm-msg");

  if (!name || !people || !phone || !email) {
    msg.style.color = "#ef9a9a";
    msg.textContent = "Please fill in all fields.";
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    msg.style.color = "#ef9a9a";
    msg.textContent = "Please enter a valid email address.";
    return;
  }

  const btn = document.getElementById("btn-confirm");
  btn.disabled = true;
  btn.textContent = "Booking…";
  showLoading(true);

  const apptData = {
    date:   selectedDate.dateStr,
    slot:   selectedSlot,
    name, people, phone, email
  };

  try {
    // Double-booking guard: fetch fresh booked slots right before writing
    const fresh = await getBookedSlots(selectedDate.dateStr);
    if (fresh.has(selectedSlot)) {
      msg.style.color = "#ef9a9a";
      msg.textContent = "Sorry, this slot was just taken. Please pick another.";
      btn.disabled = false;
      btn.textContent = "Confirm Appointment";
      showLoading(false);
      // Refresh cache
      bookedSlotsCache[selectedDate.dateStr] = fresh;
      return;
    }

    const apptId = await bookSlot(apptData);
    await sendConfirmationEmails(apptData, apptId);

    msg.style.color = "#a5d6a7";
    msg.textContent = "✅ Appointment confirmed! Check your email for details.";
    btn.textContent = "Confirmed!";

    // Refresh calendar
    bookedSlotsCache[selectedDate.dateStr] = fresh;
    bookedSlotsCache[selectedDate.dateStr].add(selectedSlot);
    renderCalendar();

    setTimeout(() => closeOverlay("form-overlay"), 2500);
  } catch(e) {
    console.error(e);
    msg.style.color = "#ef9a9a";
    msg.textContent = "Something went wrong. Please try again.";
    btn.disabled = false;
    btn.textContent = "Confirm Appointment";
  }
  showLoading(false);
});

// ─── Appointment Management (from email link) ────────────────────────────────
let managedAppt = null;

async function loadAppointmentFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const apptId = params.get("appt");
  if (!apptId) return;

  showLoading(true);
  try {
    const appt = await getAppointment(apptId);
    showLoading(false);
    if (!appt) {
      alert("Appointment not found or already cancelled.");
      return;
    }
    managedAppt = appt;
    showManagementModal(appt);
  } catch(e) {
    showLoading(false);
    console.error(e);
  }
}

function showManagementModal(appt) {
  const info = document.getElementById("appt-info");
  const isCancelled = appt.status === "cancelled";

  info.innerHTML = `
    <p><strong>Date:</strong> ${appt.date}</p>
    <p><strong>Time:</strong> ${appt.slot}</p>
    <p><strong>Name:</strong> ${appt.name}</p>
    <p><strong>People:</strong> ${appt.people}</p>
    <p><strong>Phone:</strong> ${appt.phone}</p>
    <p><strong>Email:</strong> ${appt.email}</p>
    <p><strong>Status:</strong> ${appt.status === "active" ? "✅ Confirmed" : "❌ Cancelled"}</p>
  `;

  const actions = document.getElementById("mgmt-actions");
  actions.innerHTML = "";

  if (isCancelled) return;

  const btnCancel = document.createElement("button");
  btnCancel.className = "btn-danger";
  btnCancel.textContent = "Cancel Appointment";
  btnCancel.addEventListener("click", async () => {
    if (!confirm("Are you sure you want to cancel this appointment?")) return;
    showLoading(true);
    try {
      await cancelAppointment(managedAppt.id);
      await sendMgmtUpdateEmail(managedAppt, "CANCELLED", null, null);
      managedAppt.status = "cancelled";
      info.querySelector("p:last-child").innerHTML = "<strong>Status:</strong> ❌ Cancelled";
      actions.innerHTML = "<p style='color:#a5d6a7;margin-top:8px;'>Appointment cancelled. You'll receive a confirmation email shortly.</p>";
      renderCalendar();
    } catch(e) { alert("Error cancelling. Please try again."); console.error(e); }
    showLoading(false);
  });

  const btnReschedule = document.createElement("button");
  btnReschedule.className = "btn-secondary";
  btnReschedule.textContent = "Reschedule Appointment";
  btnReschedule.addEventListener("click", () => {
    closeOverlay("mgmt-overlay");
    openRescheduleModal();
  });

  actions.appendChild(btnReschedule);
  actions.appendChild(btnCancel);

  openOverlay("mgmt-overlay");
}

// ─── Reschedule Mini-Calendar ────────────────────────────────────────────────
let reschedYear  = today.getFullYear();
let reschedMonth = today.getMonth();

function openRescheduleModal() {
  reschedYear  = today.getFullYear();
  reschedMonth = today.getMonth();
  renderReschedCal();
  openOverlay("reschedule-overlay");
}

async function renderReschedCal() {
  document.getElementById("reschedule-month-title").textContent =
    `${MONTH_NAMES[reschedMonth]} ${reschedYear}`;

  const grid = document.getElementById("reschedule-grid");
  grid.innerHTML = "";
  document.getElementById("reschedule-slot-area").innerHTML = "";

  const firstDay = new Date(reschedYear, reschedMonth, 1).getDay();
  const daysInMonth = new Date(reschedYear, reschedMonth+1, 0).getDate();

  showLoading(true);
  let monthBooked = {};
  try {
    const { collection, query, where, getDocs } = fbm();
    const startStr = dateKey(reschedYear, reschedMonth, 1);
    const endStr   = dateKey(reschedYear, reschedMonth, daysInMonth);
    const q = query(collection(idb(),"appointments"),
      where("date",">=",startStr), where("date","<=",endStr), where("status","==","active"));
    const snap = await getDocs(q);
    snap.forEach(d => {
      const data = d.data();
      if (!monthBooked[data.date]) monthBooked[data.date] = new Set();
      monthBooked[data.date].add(data.slot);
    });
  } catch(e) { console.warn(e); }
  showLoading(false);

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement("div");
    el.style.cssText = "min-height:44px;";
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateObj = new Date(reschedYear, reschedMonth, d);
    const dow = dateObj.getDay();
    const dStr = dateKey(reschedYear, reschedMonth, d);
    const isPast = dateObj < today;
    const isClosed = (dow === 0 || dow === 1);
    const cell = document.createElement("div");
    cell.style.cssText = "background:#1a1a1a;border-radius:6px;min-height:44px;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:2px solid transparent;font-size:.78rem;";

    const dayN = document.createElement("div");
    dayN.style.cssText = "font-weight:700;color:#ccc;";
    dayN.textContent = d;
    cell.appendChild(dayN);

    if (isClosed || isPast) {
      cell.style.opacity = ".35";
      cell.style.cursor = "not-allowed";
    } else {
      const allSlots = generateSlots(dateObj) || [];
      const booked = monthBooked[dStr] || new Set();
      const available = allSlots.filter(s => !booked.has(s)).length;
      const sub = document.createElement("div");
      sub.style.cssText = "color:#90caf9;font-size:.62rem;text-align:center;";
      sub.textContent = available > 0 ? `${available} avail` : "Full";
      cell.appendChild(sub);

      if (available > 0) {
        cell.addEventListener("click", () => showReschedSlots(reschedYear, reschedMonth, d, monthBooked[dStr] || new Set()));
        cell.addEventListener("mouseenter", () => { cell.style.borderColor = "#1e88e5"; });
        cell.addEventListener("mouseleave", () => { cell.style.borderColor = "transparent"; });
      } else {
        cell.style.opacity = ".4"; cell.style.cursor = "not-allowed";
      }
    }
    grid.appendChild(cell);
  }
}

function showReschedSlots(y, m, d, booked) {
  const dateObj = new Date(y, m, d);
  const dStr = dateKey(y, m, d);
  const allSlots = generateSlots(dateObj) || [];
  const area = document.getElementById("reschedule-slot-area");
  area.innerHTML = `<p style="color:#90caf9;margin-bottom:8px;font-size:.9rem;">
    ${dateObj.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})} — pick a time:</p>`;
  allSlots.forEach(slot => {
    if (booked.has(slot)) return;
    const btn = document.createElement("button");
    btn.className = "slot-btn";
    btn.textContent = slot;
    btn.style.marginBottom = "6px";
    btn.addEventListener("click", async () => {
      if (!confirm(`Reschedule to ${dStr} at ${slot}?`)) return;
      showLoading(true);
      try {
        // Check for double booking
        const fresh = await getBookedSlots(dStr);
        if (fresh.has(slot)) {
          alert("That slot was just taken. Please pick another.");
          showLoading(false);
          return;
        }
        const newId = await rescheduleAppointment(managedAppt.id, dStr, slot);
        await sendMgmtUpdateEmail(managedAppt, "RESCHEDULED", dStr, slot);
        managedAppt = await getAppointment(newId);
        closeOverlay("reschedule-overlay");
        showManagementModal(managedAppt);
        renderCalendar();
      } catch(e) { alert("Error rescheduling. Please try again."); console.error(e); }
      showLoading(false);
    });
    area.appendChild(btn);
  });
}

document.getElementById("reschedule-nav-next").addEventListener("click", () => {
  reschedMonth++;
  if (reschedMonth > 11) { reschedMonth = 0; reschedYear++; }
  renderReschedCal();
});

// ─── Navigation ──────────────────────────────────────────────────────────────
document.getElementById("nav-next").addEventListener("click", () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
});

// ─── Overlay helpers ─────────────────────────────────────────────────────────
function openOverlay(id) { document.getElementById(id).classList.add("active"); }
function closeOverlay(id) { document.getElementById(id).classList.remove("active"); }

document.getElementById("slot-close").addEventListener("click", () => closeOverlay("slot-overlay"));
document.getElementById("form-close").addEventListener("click", () => closeOverlay("form-overlay"));
document.getElementById("mgmt-close").addEventListener("click", () => closeOverlay("mgmt-overlay"));
document.getElementById("reschedule-close").addEventListener("click", () => {
  closeOverlay("reschedule-overlay");
  openOverlay("mgmt-overlay");
});

// Close overlay on backdrop click
["slot-overlay","form-overlay","mgmt-overlay","reschedule-overlay"].forEach(id => {
  document.getElementById(id).addEventListener("click", e => {
    if (e.target === document.getElementById(id)) closeOverlay(id);
  });
});

// ─── Contact FAB ─────────────────────────────────────────────────────────────
document.getElementById("contact-fab-btn").addEventListener("click", () => {
  document.getElementById("contact-menu").classList.toggle("open");
});
document.addEventListener("click", e => {
  if (!document.getElementById("contact-fab").contains(e.target)) {
    document.getElementById("contact-menu").classList.remove("open");
  }
});

// ─── Init ─────────────────────────────────────────────────────────────────────
// Wait for Firebase module to initialize
function waitForFirebase(cb, tries=0) {
  if (window._db && window._fbModules) { cb(); return; }
  if (tries > 50) { console.error("Firebase did not init"); return; }
  setTimeout(() => waitForFirebase(cb, tries+1), 100);
}

waitForFirebase(() => {
  renderCalendar();
  loadAppointmentFromUrl();
});
</script>
